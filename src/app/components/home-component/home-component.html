<h1>COMPONENTE HOME</h1>

<table class="table table-warning">
    <thead>
        <tr>
            <th>Id departamento</th>
            <th>Nombre</th>
            <th>Localidad</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        @for (dept of departamentos; track dept) {
            <tr>
                <td>{{dept.numero}}</td>
                <td>{{dept.nombre}}</td>
                <td>{{dept.localidad}}</td>
                <td>
                    <!-- <a [routerLink]="['/details/' + dept.numero + '/' + dept.nombre + '/' + dept.localidad]"> -->
                    <a [routerLink]="['/details', dept.numero, dept.nombre, dept.localidad]" class="btn btn-info">
                        Detalles
                    </a>
                    <a [routerLink]="['/update', dept.numero]" class="btn btn-warning">
                        Updatear
                    </a>
                    <button (click)="deleteDepartamento(dept.numero)" class="btn btn-danger">
                        Delete
                    </button>
                </td>
            </tr>
        }
    </tbody>
</table>
